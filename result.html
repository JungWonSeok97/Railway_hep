<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable.css">

    <title>상태 선택</title>
    <link rel="stylesheet" href="/static/result.css" />
</head>

<body>

    <div class="container">
        <div class="title-bar">
            <p class="page-title">설문결과를 학습한 AI가 예측한 사고 발생 확률</p>
        </div>

        <div class="section-card">
            <div id="hepResult"></div>
        </div>
        <div class="section-card">
            <div class="psf-grid">
                <div id="psf1Result" class="psf-item"></div>
                <div id="psf2Result" class="psf-item"></div>
                <div id="psf3Result" class="psf-item"></div>
                <div id="psf4Result" class="psf-item"></div>
                <div id="psf5Result" class="psf-item"></div>
                <div id="psf6Result" class="psf-item"></div>
                <div id="psf7Result" class="psf-item"></div>
                <div id="psf8Result" class="psf-item"></div>
            </div>
        </div>
        <div class="detail-actions">
            <a class="detail-btn" href="/detail_result">상세보기</a>
            <a class="back-button" href="/input">다시 설문하기</a>
        </div>
    </div>
    <script>
        // sessionStorage에서 데이터 읽기
        const resultsData = sessionStorage.getItem('psfResults');
        const getNumericPsfId = (psfId) => Number(String(psfId).replace('F.', ''));
        const predictionCodeToLabel = {
            'F.1.1': '보통', 'F.1.2': '나쁨', 'F.1.3': '매우나쁨',
            'F.2.1': '좋음', 'F.2.2': '보통', 'F.2.3': '나쁨',
            'F.3.1': '좋음', 'F.3.2': '보통', 'F.3.3': '나쁨',
            'F.4.1': '좋음', 'F.4.2': '보통', 'F.4.3': '나쁨',
            'F.5.1': '보통', 'F.5.2': '나쁨',
            'F.6.1': '보통', 'F.6.2': '나쁨',
            'F.7.1': '좋음', 'F.7.2': '보통', 'F.7.3': '나쁨',
            'F.8.1': '보통', 'F.8.2': '약간 높음', 'F.8.3': '매우 높음'
        };
        const getPredictedDisplayText = (result) => predictionCodeToLabel[result.predicted_text] || result.predicted_text;

        // PSF별 값 매핑 테이블
        const psfValueMappings = {
            1: { '보통': 1, '나쁨': 14.45, '매우나쁨': 17.54 },
            2: { '좋음': 0.492, '보통': 1, '나쁨': 5.654 },
            3: { '좋음': 0.292, '보통': 1, '나쁨': 8.559 },
            4: { '좋음': 0.421, '보통': 1, '나쁨': 7.229 },
            5: { '보통': 1, '나쁨': 9.559 },
            6: { '보통': 1, '나쁨': 11.576 },
            7: { '좋음': 0.322, '보통': 1, '나쁨': 12.11 },
            8: { '보통': 1, '약간 높음': 4.654, '매우 높음': 11.873 }
        };

        // 직종별 기본 HEP 값
        const roleHEPValues = {
            '기관사': { diagnosis: 0.01225, execution: 0.00615 },
            '관제사': { diagnosis: 0.0055, execution: 0.00352 },
            '정비사': { diagnosis: 0.00279, execution: 0.00347 },
            '선로작업자': { diagnosis: 0.01225, execution: 0.0035 }
        };

        // HEP 계산 함수
        function calculateHEP(results) {
            const selectedRole = sessionStorage.getItem('selectedRole') || '기관사';
            const baseHEP = roleHEPValues[selectedRole] || roleHEPValues['기관사'];

            // 각 PSF의 값을 계산
            let psfMultiplier = 1;
            const psfDetails = [];

            results.forEach(result => {
                const psfId = getNumericPsfId(result.psf_id);
                const predictedText = getPredictedDisplayText(result);
                const psfMapping = psfValueMappings[psfId];

                let psfValue = 1; // 기본값
                if (psfMapping && psfMapping[predictedText] !== undefined) {
                    psfValue = psfMapping[predictedText];
                }

                if (typeof result.hep_multiplier === 'number' && Number.isFinite(result.hep_multiplier)) {
                    psfValue = result.hep_multiplier;
                }
                psfMultiplier *= psfValue;
                psfDetails.push({
                    psfId: psfId,
                    label: predictedText,
                    value: psfValue
                });
            });

            // 진단 HEP와 수행 HEP 계산
            let diagnosisHEP = baseHEP.diagnosis * psfMultiplier;
            let executionHEP = baseHEP.execution * psfMultiplier;
            let finalHEP = diagnosisHEP + executionHEP;

            const big_diagnosisHEP = (baseHEP.diagnosis * psfMultiplier) / (baseHEP.diagnosis * (psfMultiplier - 1) + 1)
            const big_executionHEP = (baseHEP.execution * psfMultiplier) / (baseHEP.execution * (psfMultiplier - 1) + 1)
            const big_finalHEP = big_diagnosisHEP + big_executionHEP;


            if (finalHEP > 1) {
                finalHEP = big_finalHEP;
                diagnosisHEP = big_diagnosisHEP;
                executionHEP = big_executionHEP;
            }
            console.log(big_diagnosisHEP)
            console.log(big_executionHEP)
            console.log(finalHEP)

            return {
                role: selectedRole,
                baseDiagnosis: baseHEP.diagnosis,
                baseExecution: baseHEP.execution,
                psfMultiplier: psfMultiplier,
                diagnosisHEP: diagnosisHEP,
                executionHEP: executionHEP,
                finalHEP: finalHEP,
                psfDetails: psfDetails
            };
        }

        // HEP 결과 표시 함수
        function displayHEPResults(hepData) {
            const hepElement = document.getElementById('hepResult');

            const final = Number(hepData.finalHEP);
            const minHEP = 0;
            const maxHEP = 2;
            const goodMax = 1;
            const normalMax = 1.995;
            const safeFinal = Number.isFinite(final) ? final : 0;
            const clampedFinal = Math.max(minHEP, Math.min(safeFinal, maxHEP));
            const segmentPercent = 100 / 3;
            const segGood = segmentPercent;
            const segNormal = segmentPercent;
            const segBad = segmentPercent;
            let fillPercent = 0;

            if (clampedFinal <= goodMax) {
                fillPercent = ((clampedFinal - minHEP) / (goodMax - minHEP)) * segGood;
            } else if (clampedFinal <= normalMax) {
                fillPercent = segGood + ((clampedFinal - goodMax) / (normalMax - goodMax)) * segNormal;
            } else {
                fillPercent = segGood + segNormal + ((clampedFinal - normalMax) / (maxHEP - normalMax)) * segBad;
            }

            let gradeText = '';
            let gradeClass = '';

            if (final >= 0 && final < 1) {
                gradeText = '좋음';
                gradeClass = 'hep-good';
            } else if (final >= 1 && final < 1.995) {
                gradeText = '보통';
                gradeClass = 'hep-normal';
            } else if (final >= 1.995 && final <= 2) {
                gradeText = '나쁨';
                gradeClass = 'hep-bad';
            } else {
                // 범위 밖 예외 처리(원하면 문구 변경)
                gradeText = '범위초과';
                gradeClass = 'hep-bad';
            }

            hepElement.innerHTML = `
  <div class="hep-wrap">
    <br>
    <h3 class="result_h3">사고발생 확률 진단 결과</h3>
    <span class="hep-badge ${gradeClass}">${gradeText}</span>
    <br>
    <div class="hep-level-bar">
        
      <div class="hep-level-track" style="--hep-marker: 0%;">
        <div class="hep-marker ${gradeClass}">
          <span class="hep-marker-label"></span>
        </div>
      </div>

      <div class="hep-level-labels">
        <span class="hep-label">좋음</span>
        <span class="hep-label">보통</span>
        <span class="hep-label">나쁨</span>
      </div>
    </div>
  </div>
`;

            const bar = hepElement.querySelector('.hep-level-bar');
            if (bar) {
                bar.style.setProperty('--seg-good', `${segGood.toFixed(4)}%`);
                bar.style.setProperty('--seg-normal', `${segNormal.toFixed(4)}%`);
                bar.style.setProperty('--seg-bad', `${segBad.toFixed(4)}%`);
                bar.style.setProperty('--seg-good-end', `${segGood.toFixed(4)}%`);
                bar.style.setProperty('--seg-normal-end', `${(segGood + segNormal).toFixed(4)}%`);
            }

            const track = hepElement.querySelector('.hep-level-track');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    track.style.setProperty('--hep-marker', `${fillPercent.toFixed(2)}%`);
                });
            });

            const markerLabel = hepElement.querySelector('.hep-marker-label');
            if (markerLabel) {
                const formatted = Number.isFinite(final) ? final.toLocaleString() : '0';
                markerLabel.textContent = `Final HEP ${formatted}`;
            }

        }


        function getChipClass(label) {
            if (label === '좋음') return 'chip-good';
            else if (label === '보통') return 'chip-common'
            else if (label === '나쁨') return 'chip-bad';
            else if (label === '약간 높음') return 'chip-little-bad';
            else return 'chip-verybad';
        }
        if (resultsData) {
            let data;
            try { data = JSON.parse(resultsData); } catch { data = { success: false }; }

            if (data && data.success && Array.isArray(data.results) && data.results.length > 0) {

                // PSF1: 피로도 (작업부하)
                const psf1 = data.results.find(r => r.psf_id === 'F.1');
                if (psf1) {
                    const psf1Element = document.getElementById('psf1Result');
                    const label = getPredictedDisplayText(psf1);
                    const chipClass = getChipClass(label)
                    psf1Element.innerHTML = `
                        <div class="psf-icon"><img src="/images/workload.png" alt="작업부하" /></div>
                        <h3>작업부하</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF2: 장비 품질
                const psf2 = data.results.find(r => r.psf_id === 'F.2');
                if (psf2) {
                    const psf2Element = document.getElementById('psf2Result');
                    const label = getPredictedDisplayText(psf2);
                    const chipClass = getChipClass(label)
                    psf2Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/railwy_work_vehicle.png" alt="장비 및 기기" /></div>
                        <h3>장비 및 기기</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF3: 절차서 품질
                const psf3 = data.results.find(r => r.psf_id === 'F.3');
                if (psf3) {
                    const psf3Element = document.getElementById('psf3Result');
                    const label = getPredictedDisplayText(psf3);
                    const chipClass = getChipClass(label)
                    psf3Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/memo.png" alt="절차 및 지침" /></div>
                        <h3>절차 및 지침</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF4: 교육/훈련
                const psf4 = data.results.find(r => r.psf_id === 'F.4');
                if (psf4) {
                    const psf4Element = document.getElementById('psf4Result');
                    const label = getPredictedDisplayText(psf4);
                    const chipClass = getChipClass(label)
                    psf4Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/education.png" alt="교육 및 훈련" /></div>
                        <h3>교육 및 훈련</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF5: 의사소통
                const psf5 = data.results.find(r => r.psf_id === 'F.5');
                if (psf5) {
                    const psf5Element = document.getElementById('psf5Result');
                    const label = getPredictedDisplayText(psf5);
                    const chipClass = getChipClass(label)
                    psf5Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/communication.png" alt="의사소통" /></div>
                        <h3>의사소통</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF6: 업무 환경
                const psf6 = data.results.find(r => r.psf_id === 'F.6');
                if (psf6) {
                    const psf6Element = document.getElementById('psf6Result');
                    const label = getPredictedDisplayText(psf6);
                    const chipClass = getChipClass(label)
                    psf6Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/environment.png" alt="환경" /></div>
                        <h3>환경</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF7: 작업 절차
                const psf7 = data.results.find(r => r.psf_id === 'F.7');
                if (psf7) {
                    const psf7Element = document.getElementById('psf7Result');
                    const label = getPredictedDisplayText(psf7);
                    const chipClass = getChipClass(label)
                    psf7Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/work_procedure.png" alt="작업절차" /></div>
                        <h3>작업절차</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // PSF8: 직무 복잡도
                const psf8 = data.results.find(r => r.psf_id === 'F.8');
                if (psf8) {
                    const psf8Element = document.getElementById('psf8Result');
                    const label = getPredictedDisplayText(psf8);
                    const chipClass = getChipClass(label)
                    psf8Element.innerHTML = `
                    <div class="psf-icon"><img src="/images/complexity.png" alt="복잡성" /></div>
                        <h3>복잡성</h3>
                        <span class="chip ${chipClass}">${label}</span>
                    `;
                }

                // HEP 계산 및 표시
                const hepData = calculateHEP(data.results);
                displayHEPResults(hepData);

            } else {
                document.body.innerHTML += '<p>분석 결과가 없습니다.</p>';
            }
        } else {
            document.body.innerHTML += '<p>데이터가 없습니다. 설문조사를 먼저 완료해주세요.</p>';
        }
    </script>
</body>

</html>
