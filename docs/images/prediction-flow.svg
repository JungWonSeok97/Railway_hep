<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">설문 입력에서 PSF 평가와 배수 제공까지</title><desc id="desc">서버가 PSF 수준과 배수 및 전체 배수의 곱을 반환하며, 외부 시스템이 직무별 HEP를 계산하는 구조.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8ca2"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1200" height="740" rx="24" fill="#f4f7fb" stroke="#f4f7fb"/>
<text x="44" y="43" font-size="16" fill="#2563eb" font-weight="700">RAILWAY HEP / PREDICTION FLOW</text>
<text x="44" y="90" font-size="34" fill="#102a43" font-weight="700">설문 입력에서 PSF 평가와 배수 제공까지</text>
<text x="44" y="127" font-size="21" fill="#52657a" font-weight="400">기본 /api/predict 경로 · 서버는 PSF별 배수와 전체 곱을 제공합니다.</text>
<rect x="44" y="175" width="300" height="185" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="195" width="50" height="30" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="75" y="217" font-size="17" fill="#fff" font-weight="700">01</text><text x="66" y="263" font-size="26" fill="#102a43" font-weight="700">설문 입력</text><text x="66" y="302" font-size="21" fill="#52657a" font-weight="400">직종 · 8개 PSF 문항</text><text x="66" y="334" font-size="21" fill="#52657a" font-weight="400">교육 후 경과 개월 수</text><rect x="390" y="175" width="766" height="295" rx="16" fill="#e9f0fc" stroke="#c8d8f2"/><text x="414" y="210" font-size="24" fill="#2563eb" font-weight="700">02  Flask 서버 · PSF 평가와 배수 계산</text><rect x="414" y="231" width="344" height="208" rx="16" fill="#fff" stroke="#dce5ef"/><text x="436" y="269" font-size="24" fill="#102a43" font-weight="700">F.1–3 / F.5–8</text><text x="436" y="308" font-size="22" fill="#52657a" font-weight="400">문항 정규화</text><text x="436" y="340" font-size="22" fill="#52657a" font-weight="400">일부 PSF의 GMM 특성</text><text x="436" y="379" font-size="22" fill="#2563eb" font-weight="700">CatBoost → 수준 · 확률 · 배수</text><rect x="782" y="231" width="350" height="208" rx="16" fill="#fff" stroke="#dce5ef"/><text x="804" y="269" font-size="24" fill="#102a43" font-weight="700">F.4 교육·훈련</text><text x="804" y="308" font-size="22" fill="#52657a" font-weight="400">경과 개월 수 계산식</text><text x="804" y="340" font-size="22" fill="#52657a" font-weight="400">분류 확률: null</text><text x="804" y="379" font-size="22" fill="#0f766e" font-weight="700">공식 → 수준 · PSF 배수</text><path d="M344 267 L404 267" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M774 470 L774 517" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="520" width="1112" height="175" rx="16" fill="#fff" stroke="#dce5ef"/><text x="68" y="560" font-size="25" fill="#102a43" font-weight="700">03  배수의 곱 제공 · 화면 표시와 외부 연계</text><text x="68" y="604" font-size="23" fill="#2563eb" font-weight="700">PSF 배수의 곱</text><path d="M300 597 L350 597" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="375" y="604" font-size="23" fill="#102a43" font-weight="700">요약 · 상세 · 배수 그래프</text><path d="M687 597 L738 597" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="760" y="604" font-size="23" fill="#0f766e" font-weight="700">외부 직무별 HEP 계산</text><text x="68" y="656" font-size="21" fill="#52657a" font-weight="400">PSF 배수의 곱은 확률이 아닙니다. 진단·수행 HEP는 외부 시스템에서 직무 기준에 따라 계산합니다.</text>
</g></svg>
